name: OpenWiki Update

# Kept up to date without anybody remembering it: every night when the code changed since the
# wiki last did, on every release, and by hand when needed. The pull request merges by itself.
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      message:
        description: "What to tell OpenWiki for this run (e.g. a rename to apply throughout the wiki)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # main, also when a release tag starts the run: on the tag the checkout is a detached HEAD,
      # from which no pull request can be opened, and the wiki describes main anyway
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # The model costs money: a night with no change to the code since the wiki's last update
      # stops here. A release or a manual run always goes on.
      - name: Anything new since the last wiki update?
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git log -1 --format=%H -- openwiki)
          if [ -z "$last" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$last" HEAD -- . ':!openwiki' ':!AGENTS.md' ':!CLAUDE.md' | wc -l)
          echo "files changed since $last: $changed"
          if [ "$changed" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install OpenWiki
        if: steps.changes.outputs.run == 'true'
        run: npm install --global openwiki

      - name: Run OpenWiki
        if: steps.changes.outputs.run == 'true'
        # --init the first time, when there is no wiki yet; the message, when given by hand, is an
        # instruction for this run, like a rename that the incremental update would not apply by itself
        run: |
          mode=--update; [ -d openwiki ] || mode=--init
          if [ -n "$MESSAGE" ]; then openwiki code "$mode" --print "$MESSAGE"; else openwiki code "$mode" --print; fi
        env:
          MESSAGE: ${{ inputs.message }}
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: xiaomi/mimo-v2.5-pro
          LANGCHAIN_TRACING_V2: "false"

      - name: Create OpenWiki update pull request
        id: cpr
        if: steps.changes.outputs.run == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          base: main
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the OpenWiki workflow and merges by itself.

      # Merged by itself, or the wiki would wait for somebody to remember the pull request instead.
      # --auto needs "Allow auto-merge" on the repository; without required checks there is nothing
      # to wait for, and the plain merge does it at once.
      - name: Merge the pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch --auto \
            || gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch
